<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendium - Prototyp</title>
    <style>
        .card.book {
  background-color: var(--card-bg);
  border: 1px solid #262b26;
  border-left: 4px solid var(--green-dim);
  border-radius: 4px 8px 8px 4px;
  padding: 1.5rem 1.5rem 1.5rem 1.25rem;
  cursor: default;
  transition: border-left-color 0.25s, box-shadow 0.25s, background-color 0.25s;
}

.card.book:hover {
  border-left-color: var(--green);
  background-color: #161d16;
  box-shadow: 0 0 0 1px rgba(51, 255, 102, 0.08), 0 4px 16px rgba(0, 0, 0, 0.35);
}

.card.book h3 {
  color: var(--text-white);
  font-size: 1.1rem;
  font-style: italic;
  margin: 0 0 0.35rem 0;
}

.card.book .author {
  color: var(--green);
  font-weight: 600;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 0.75rem;
  padding-bottom: 0.5rem;
  display: block;
  border-bottom: 1px solid rgba(159, 205, 175, 0.15);
}

.card.book p {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.55;
}
    </style>
</head>
<body>

    <header>
        <h1>COMPENDIUM</h1>
        <p class="subtitle">Ordnung im Meer der Bücher.</p>
    </header>

    <div id="app-container">
        <div class="nav-header">
            <button id="back-btn">← Zurück</button>
            <div id="current-category">Wähle deinen Pfad</div>
        </div>
        <div id="content-grid" class="grid">
            
        </div>
    </div>

    <script>
       
        const genreTree = {
            id: "root",
            title: "Wähle deinen Pfad",
            children: [
                {
                    id: "fiction",
                    title: "Belletristik",
                    desc: "Eintauchen in fiktive Welten, Geschichten und Romane.",
                    children: [
                        {
                            id: "scifi",
                            title: "Science Fiction",
                            desc: "Technologische Zukunftsvisionen und ferne Galaxien.",
                            children: [
                                { isBook: true, title: "Dune", author: "Frank Herbert", desc: "Ein Meisterwerk über Politik, Religion und Ökologie auf einem Wüstenplaneten." },
                                { isBook: true, title: "Foundation", author: "Isaac Asimov", desc: "Der Fall und Wiederaufbau eines galaktischen Imperiums." }
                            ]
                        },
                        {
                            id: "fantasy",
                            title: "Fantasy",
                            desc: "Magie, Mythen und epische Heldenreisen.",
                            children: [
                                { isBook: true, title: "Der Herr der Ringe", author: "J.R.R. Tolkien", desc: "Der Klassiker, der das Genre definierte." }
                            ]
                        }
                    ]
                },
                {
                    id: "non-fiction",
                    title: "Fachliteratur",
                    desc: "Wissen, Philosophie, Geschichte und Technologie.",
                    children: [
                        {
                            id: "tech",
                            title: "Informatik & Code",
                            desc: "Bücher über Softwareentwicklung und Architektur.",
                            children: [
                                { isBook: true, title: "Clean Code", author: "Robert C. Martin", desc: "Handbuch für agile Softwarehandwerkskunst." }
                            ]
                        },
                        {
                            id: "philosophy",
                            title: "Philosophie",
                            desc: "Gedanken über die Existenz, Moral und Erkenntnis.",
                            children: [
                                { isBook: true, title: "Meditationen", author: "Marcus Aurelius", desc: "Tagebuch eines römischen Kaisers über den Stoizismus." }
                            ]
                        }
                    ]
                }
            ]
        };

        
        let historyStack = [];
        let currentNode = genreTree;

       
        const grid = document.getElementById('content-grid');
        const backBtn = document.getElementById('back-btn');
        const categoryLabel = document.getElementById('current-category');

        
        function renderNode(node) {
            grid.innerHTML = ''; 
            categoryLabel.textContent = node.title;

            
            if (historyStack.length > 0) {
                backBtn.style.display = 'block';
            } else {
                backBtn.style.display = 'none';
            }

            
            node.children.forEach(child => {
                const card = document.createElement('div');
                card.className = 'card' + (child.isBook ? ' book' : '');

                if (child.isBook) {
                    card.innerHTML = `
                        <h3>${child.title}</h3>
                        <span class="author">By ${child.author}</span>
                        <p>${child.desc}</p>
                    `;
                } else {
                    card.innerHTML = `
                        <h3>${child.title}</h3>
                        <p>${child.desc}</p>
                    `;
                    
                    card.addEventListener('click', () => {
                        historyStack.push(currentNode);
                        currentNode = child;
                        renderNode(currentNode);
                    });
                }
                grid.appendChild(card);
            });
        }

        
        backBtn.addEventListener('click', () => {
            if (historyStack.length > 0) {
                currentNode = historyStack.pop();
                renderNode(currentNode);
            }
        });

        
        renderNode(currentNode);
    </script>
</body>
</html>
