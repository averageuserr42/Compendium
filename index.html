<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendium - Prototyp</title>
    <style>
        :root {
            --bg: #0A0A0A;
            --card-bg: #121712;
            --green: #33FF66;
            --green-dim: #1F8F44;
            --text-white: #FFFFFF;
            --text-muted: #9FCDAF;

            /* Form und Lesbarkeit (reine Darstellung) */
            --sans: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif;
            --mono: ui-monospace, 'Cascadia Mono', 'Courier New', monospace;
            --border: #232a24;
            --radius-card: 14px;
            --radius-pill: 999px;
            --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.5);
            --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: radial-gradient(1100px 520px at 50% -8%, rgba(51, 255, 102, 0.05), transparent 62%), var(--bg);
            color: var(--text-white);
            font-family: var(--sans);
            min-height: 100vh;
            padding: 3rem 2rem 4rem 2rem;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 2.5rem auto;
            border-bottom: 1px solid var(--green-dim);
            padding-bottom: 1.5rem;
            text-align: center;
        }

        /* Buchtitel wie auf einer Titelseite: Serifenschrift, gesperrt, mittig */
        header h1 {
            font-family: var(--serif);
            color: var(--green);
            margin: 0 0 0.85rem 0;
            font-size: clamp(2rem, 4.6vw, 3rem);
            font-weight: 400;
            letter-spacing: 0.16em;
            line-height: 1.2;
            text-shadow: 0 0 30px rgba(51, 255, 102, 0.18);
        }

        header .subtitle {
            font-family: var(--serif);
            font-style: italic;
            color: var(--text-muted);
            margin: 0 0 0.5rem 0;
            font-size: 1.05rem;
        }

        header .legend {
            color: var(--green-dim);
            margin: 0;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
        }

        #app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .tree-switcher {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .tree-btn {
            background: transparent;
            border: 1px solid var(--green-dim);
            color: var(--text-muted);
            padding: 0.55rem 1.3rem;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tree-btn.active,
        .tree-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: rgba(51, 255, 102, 0.06);
        }

        .nav-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
            min-height: 2rem;
        }

        #back-btn {
            background: transparent;
            border: 1px solid var(--green-dim);
            color: var(--green);
            padding: 0.45rem 1.05rem;
            border-radius: var(--radius-pill);
            font-family: inherit;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        #back-btn:hover {
            border-color: var(--green);
            background: rgba(51, 255, 102, 0.06);
        }

        #current-category {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
        }

        /* Enge Spalten nur für die Bücher (Poster), Kategorien bleiben breit */
        .grid .grid-books,
        .grid-books {
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
        }

        .status {
            color: var(--text-muted);
            font-size: 1rem;
            padding: 8px 2px;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: linear-gradient(180deg, #151b15 0%, var(--card-bg) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: inset 3px 0 0 var(--green), var(--shadow-card);
            padding: 1.4rem 1.5rem 1.5rem 1.5rem;
            cursor: pointer;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
            animation: cardIn 0.35s ease-out backwards;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(51, 255, 102, 0.35);
            box-shadow: inset 3px 0 0 var(--green), var(--shadow-hover);
        }

        .card h3 {
            color: var(--text-white);
            margin: 0 0 0.55rem 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.35;
        }

        .card .meta {
            display: inline-block;
            padding: 0.24rem 0.65rem;
            border: 1px solid rgba(31, 143, 68, 0.45);
            border-radius: var(--radius-pill);
            background: rgba(31, 143, 68, 0.14);
            color: var(--green);
            font-family: var(--mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 0.8rem;
        }

        .card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.72;
        }

        .card p.desc {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card p.desc.expanded {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .desc-toggle {
            display: inline-block;
            margin-top: 0.6rem;
            background: none;
            border: none;
            padding: 0;
            color: var(--green-dim);
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: color 0.2s;
        }

        .desc-toggle:hover {
            color: var(--green);
            text-decoration: underline;
        }

        /* Buchkarte als Poster: das Titelbild füllt die ganze Karte.
           Titel und Autor stehen schon auf dem Bild, unten liegt eine
           dunkle Leiste mit Beschreibung und Knöpfen. */
        .grid-books {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 1.1rem;
        }

        .card.book {
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            cursor: default;
        }

        .card.book:hover {
            box-shadow: 0 0 0 1px var(--green-dim), var(--shadow-hover);
        }

        .cover-wrap {
            position: relative;
            line-height: 0;
        }

        /* Fallback ohne Bild: dunkle Fläche mit Titel und Autor */
        .cover-fallback {
            width: 100%;
            aspect-ratio: 2 / 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
            text-align: center;
            background: linear-gradient(160deg, #151b15 0%, #0d110d 100%);
            border-bottom: 1px solid var(--green-dim);
        }

        .cover-fallback h3 {
            font-family: var(--serif);
            font-style: italic;
            font-size: 1.1rem;
            line-height: 1.3;
            margin: 0;
            color: var(--text-white);
            word-break: break-word;
        }

        .cover-fallback .cap-author {
            color: var(--text-muted);
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .card.book .cover {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: #0d110d;
        }

        /* ★ als Ecke auf dem Bild — auch für hochgeladene Fotos sichtbar */
        .cover-badge {
            position: absolute;
            top: 0.55rem;
            right: 0.55rem;
            color: var(--green);
            font-size: 1.15rem;
            line-height: 1;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }

        /* Fallback: Werk ohne generiertes SVG (z. B. Foto aus dem Formular,
           ohne Schrift auf dem Bild) bekommt Titel und Autor als Zeile */
        .cover-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 1.4rem 0.8rem 0.6rem 0.8rem;
            background: linear-gradient(180deg, rgba(10, 10, 10, 0) 0%, rgba(10, 10, 10, 0.92) 70%);
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-white);
            line-height: 1.45;
        }

        .cover-caption .cap-author {
            display: block;
            color: var(--text-muted);
            font-size: 0.66rem;
            margin-top: 0.15rem;
        }

        /* Dunkle Leiste unten: Beschreibung und Knöpfe */
        .book-overlay {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            flex: 1 1 auto;
            padding: 0.75rem 0.85rem 0.85rem 0.85rem;
            background: linear-gradient(180deg, rgba(18, 23, 18, 0.55) 0%, var(--card-bg) 45%);
            border-top: 1px solid var(--border);
        }

        .book-overlay p.desc {
            font-size: 0.86rem;
            line-height: 1.5;
            margin: 0;
        }

        .book-overlay .desc-toggle {
            margin-top: 0;
            align-self: flex-start;
            font-size: 0.78rem;
        }

        .book-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            align-items: center;
            margin-top: auto;
            padding-top: 0.55rem;
        }

        .book-actions .wiki-link,
        .book-actions .cross-link {
            font-size: 0.76rem;
            padding: 0.32rem 0.65rem;
        }

        .book-actions .cross-link .cross-icon {
            margin-right: 0.25rem;
        }

        .book-actions .cross-link {
            margin-top: 0;
        }

        .wiki-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.42rem 0.85rem;
            border: 1px solid rgba(159, 205, 175, 0.3);
            border-radius: var(--radius-pill);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .wiki-link:hover {
            border-color: var(--green-dim);
            color: var(--green);
        }

        /* Formular: neues Werk anlegen */
        .add-panel {
            margin-bottom: 1.2rem;
        }

        .add-toggle,
        .add-submit,
        .add-cancel {
            font-family: inherit;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s, color 0.2s;
        }

        .add-toggle,
        .add-submit {
            background: rgba(51, 255, 102, 0.08);
            border: 1px solid var(--green-dim);
            color: var(--green);
        }

        .add-toggle:hover,
        .add-submit:hover {
            border-color: var(--green);
            background: rgba(51, 255, 102, 0.14);
        }

        .add-cancel {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .add-cancel:hover {
            border-color: var(--green-dim);
            color: var(--green);
        }

        .add-form {
            margin-top: 0.8rem;
            padding: 1.1rem 1.2rem;
            background: linear-gradient(180deg, #151b15 0%, var(--card-bg) 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            margin-bottom: 0.75rem;
        }

        .form-row label {
            color: var(--text-muted);
            font-size: 0.82rem;
            letter-spacing: 0.03em;
        }

        .form-row input[type="text"],
        .form-row input[type="url"],
        .form-row select,
        .form-row textarea {
            background: #0d110d;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-white);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.5rem 0.65rem;
        }

        .form-row input:focus,
        .form-row select:focus,
        .form-row textarea:focus {
            outline: 2px solid var(--green);
            outline-offset: 1px;
        }

        .form-row.form-check label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-white);
            font-size: 0.9rem;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .star {
            color: var(--green);
            font-size: 0.95em;
            margin-right: 0.25em;
            filter: drop-shadow(0 0 4px rgba(51, 255, 102, 0.4));
        }

        .cross-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 1rem;
            padding: 0.42rem 0.85rem;
            border: 1px solid var(--green-dim);
            border-radius: var(--radius-pill);
            color: var(--green);
            font-size: 0.85rem;
            cursor: pointer;
            background: rgba(51, 255, 102, 0.04);
            transition: border-color 0.2s, background-color 0.2s;
        }

        .cross-link:hover {
            border-color: var(--green);
            background: rgba(51, 255, 102, 0.1);
        }

        .cross-icon {
            font-weight: 700;
            font-size: 1em;
        }

        /* Tastatur-Fokus sichtbar machen */
        .tree-btn:focus-visible,
        #back-btn:focus-visible,
        .desc-toggle:focus-visible,
        .cross-link:focus-visible,
        .wiki-link:focus-visible,
        .add-toggle:focus-visible,
        .add-submit:focus-visible,
        .add-cancel:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        /* Systemeinstellung für weniger Bewegung respektieren */
        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; }
            .card:hover { transform: none; }
            .card,
            .tree-btn,
            #back-btn,
            .desc-toggle,
            .wiki-link,
            .add-toggle,
            .add-submit,
            .add-cancel,
            .cross-link { transition: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>COMPENDIUM</h1>
        <p class="subtitle">Ordnung im Meer der Bücher.</p>
        <p class="legend"><span class="star">★</span> Persönlich gelesen und empfohlen</p>
    </header>

    <div id="app-container">
        <div class="tree-switcher">
            <button class="tree-btn active" data-tree="literature">Literatur</button>
            <button class="tree-btn" data-tree="novels">Manga &amp; Web-Novels</button>
        </div>

        <section id="add-panel" class="add-panel" hidden>
            <button type="button" id="add-toggle" class="add-toggle">＋ Werk hinzufügen</button>

            <form id="add-form" class="add-form" hidden>
                <div class="form-row">
                    <label for="add-parent">Kategorie</label>
                    <select id="add-parent" required></select>
                </div>
                <div class="form-row">
                    <label for="add-title">Titel</label>
                    <input id="add-title" type="text" required>
                </div>
                <div class="form-row">
                    <label for="add-author">Autor</label>
                    <input id="add-author" type="text" required>
                </div>
                <div class="form-row">
                    <label for="add-desc">Beschreibung</label>
                    <textarea id="add-desc" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <label for="add-wiki">Wikipedia-Link</label>
                    <input id="add-wiki" type="url" placeholder="https://de.wikipedia.org/wiki/...">
                </div>
                <div class="form-row">
                    <label for="add-cover">Titelbild (JPG, PNG oder WEBP, max. 3 MB)</label>
                    <input id="add-cover" type="file" accept="image/jpeg,image/png,image/webp">
                </div>
                <div class="form-row form-check">
                    <label for="add-recommended"><input id="add-recommended" type="checkbox"> Persönlich gelesen und empfohlen (★)</label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="add-submit">Speichern</button>
                    <button type="button" id="add-cancel" class="add-cancel">Abbrechen</button>
                </div>
                <p id="add-status" class="status" role="status"></p>
            </form>
        </section>

        <p id="add-hint" class="status" hidden>Neue Werke lassen sich nur mit laufendem Backend anlegen (python app.py). Die Live-Demo auf GitHub Pages ist zum Lesen da.</p>

        <div class="nav-header">
            <button id="back-btn">← Zurück</button>
            <div id="current-category">Wähle deinen Pfad</div>
        </div>

        <div id="content-grid" class="grid"></div>
    </div>

    <script>
        const treeLabels = {
            literature: 'Literatur',
            novels: 'Manga & Web-Novels'
        };

        let trees = null;
        let dataSource = null;

        async function loadTrees() {
            const sources = ['/api/trees', 'data/trees.json'];

            for (const url of sources) {
                try {
                    const response = await fetch(url);
                    if (response.ok) {
                        dataSource = url;
                        return await response.json();
                    }
                } catch (error) {
                    // Server nicht erreichbar — nächste Quelle versuchen
                }
            }

            return null;
        }

        async function start() {
            trees = await loadTrees();

            if (!trees) {
                grid.innerHTML = '<p class="status">Daten konnten nicht geladen werden. Bitte den Server starten: python app.py</p>';
                return;
            }

            currentNode = trees[activeTreeKey];
            renderNode(currentNode);
            setupAddPanel();
        }

        let activeTreeKey = 'literature';
        let historyStack = [];
        let currentNode = null;

        const grid = document.getElementById('content-grid');
        const backBtn = document.getElementById('back-btn');
        const categoryLabel = document.getElementById('current-category');
        const treeButtons = document.querySelectorAll('.tree-btn');

        function countWorks(node) {
            if (!node.children) return 0;
            return node.children.reduce((sum, child) => sum + (child.isBook ? 1 : countWorks(child)), 0);
        }

        function findPath(node, targetId, path = []) {
            const currentPath = [...path, node];
            if (node.id === targetId) return currentPath;
            if (!node.children) return null;
            for (const child of node.children) {
                const result = findPath(child, targetId, currentPath);
                if (result) return result;
            }
            return null;
        }

        function navigateTo(targetId) {
            for (const key of Object.keys(trees)) {
                const path = findPath(trees[key], targetId);
                if (!path) continue;

                const target = path[path.length - 1];
                activeTreeKey = key;

                if (target.isBook && path.length >= 2) {
                    historyStack = path.slice(0, -2);
                    currentNode = path[path.length - 2];
                } else {
                    historyStack = path.slice(0, -1);
                    currentNode = target;
                }

                updateSwitcher();
                renderNode(currentNode);
                return;
            }
            console.warn('Cross-Link target not found:', targetId);
        }

        function updateSwitcher() {
            treeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tree === activeTreeKey);
            });
        }

        function switchTree(key) {
            if (activeTreeKey === key) return;
            activeTreeKey = key;
            historyStack = [];
            currentNode = trees[key];
            updateSwitcher();
            renderNode(currentNode);
        }

        function updateBreadcrumb() {
            if (historyStack.length === 0) {
                categoryLabel.textContent = 'Wähle deinen Pfad';
                return;
            }
            const path = [...historyStack, currentNode].slice(1).map(n => n.title);
            categoryLabel.textContent = [treeLabels[activeTreeKey], ...path].join(' › ');
        }

        function goBack() {
            if (historyStack.length === 0) return;
            currentNode = historyStack.pop();
            renderNode(currentNode);
        }

        function renderNode(node) {
            grid.innerHTML = '';
            updateBreadcrumb();
            backBtn.style.display = historyStack.length > 0 ? 'block' : 'none';

            // Kategorien brauchen breite Karten, Bücher enge Poster —
            // die Spaltenbreite gehört deshalb an den Container.
            const onlyBooks = node.children.length > 0 && node.children.every(child => child.isBook);
            grid.classList.toggle('grid-books', onlyBooks);

            node.children.forEach((child, index) => {
                const card = document.createElement('div');
                card.className = 'card' + (child.isBook ? ' book' : '');
                card.style.animationDelay = `${index * 40}ms`;

                if (child.isBook) {
                    // Generierte SVG-Cover tragen Titel und Autor selbst.
                    // Fremde Bilder (z. B. Foto aus dem Formular) nicht —
                    // dafür gibt es die Zeile unten auf dem Bild.
                    const isSvgCover = typeof child.cover === 'string' && child.cover.endsWith('.svg');
                    // ★ steht schon im SVG — Badge nur für Bilder ohne eigene Schrift
                    const badge = (child.recommended && !isSvgCover)
                        ? '<span class="cover-badge" title="Persönlich gelesen und empfohlen">★</span>'
                        : '';
                    const caption = (child.cover && !isSvgCover)
                        ? `<div class="cover-caption">${child.title}
                            <span class="cap-author">Von ${child.author || ''}</span></div>`
                        : '';
                    const cover = child.cover
                        ? `<div class="cover-wrap">
                            <img class="cover" src="${child.cover}" alt="Titelbild von ${child.title}" loading="lazy">
                            ${badge}${caption}
                        </div>`
                        : `<div class="cover-wrap">
                            <div class="cover cover-fallback">
                                <h3>${child.title}</h3>
                                <span class="cap-author">Von ${child.author || ''}</span>
                            </div>
                        </div>`;
                    const wikiLink = child.wiki
                        ? `<a class="wiki-link" href="${child.wiki}" target="_blank" rel="noopener">↗ Wikipedia</a>`
                        : '';
                    const crossLink = child.relatedId
                        ? `<div class="cross-link" data-target="${child.relatedId}"><span class="cross-icon">↔</span><span>${child.relatedTitle}</span></div>`
                        : '';
                    const actions = wikiLink || crossLink
                        ? `<div class="book-actions">${wikiLink}${crossLink}</div>`
                        : '';

                    card.innerHTML = `
                        ${cover}
                        <div class="book-overlay">
                            <p class="desc">${child.desc || ''}</p>
                            ${actions}
                        </div>
                    `;

                    const link = card.querySelector('.cross-link');
                    if (link) {
                        link.addEventListener('click', (e) => {
                            e.stopPropagation();
                            navigateTo(link.dataset.target);
                        });
                    }
                } else {
                    const count = countWorks(child);
                    const countLabel = count > 0
                        ? `<span class="meta">${count} ${count === 1 ? 'Werk' : 'Werke'}</span>`
                        : '';

                    card.innerHTML = `
                        <h3>${child.title}</h3>
                        ${countLabel}
                        <p>${child.desc}</p>
                    `;

                    card.addEventListener('click', () => {
                        historyStack.push(currentNode);
                        currentNode = child;
                        renderNode(currentNode);
                    });
                }

                grid.appendChild(card);

                if (child.isBook) {
                    const descEl = card.querySelector('.desc');
                    const needsToggle = descEl.scrollHeight - descEl.clientHeight > 2;

                    if (needsToggle) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'desc-toggle';
                        btn.textContent = 'Mehr anzeigen';
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const expanded = descEl.classList.toggle('expanded');
                            btn.textContent = expanded ? 'Weniger anzeigen' : 'Mehr anzeigen';
                        });
                        descEl.insertAdjacentElement('afterend', btn);
                    }
                }
            });
        }

        // ---- Neues Werk anlegen (braucht das laufende Flask-Backend) ----
        const addPanel = document.getElementById('add-panel');
        const addHint = document.getElementById('add-hint');
        const addToggle = document.getElementById('add-toggle');
        const addForm = document.getElementById('add-form');
        const addStatus = document.getElementById('add-status');
        const addParent = document.getElementById('add-parent');
        const addCover = document.getElementById('add-cover');
        let uploadedCover = '';

        function collectCategories(node, path, result) {
            result.push({ id: node.id, label: path.join(' › ') });
            node.children.forEach(child => {
                if (!child.isBook) collectCategories(child, [...path, child.title], result);
            });
            return result;
        }

        function fillCategories() {
            if (!trees) return;
            addParent.innerHTML = '';

            Object.keys(trees).forEach(key => {
                const options = [];
                (trees[key].children || []).forEach(child => {
                    if (!child.isBook) collectCategories(child, [treeLabels[key], child.title], options);
                });

                options.forEach(option => {
                    const element = document.createElement('option');
                    element.value = option.id;
                    element.textContent = option.label;
                    addParent.appendChild(element);
                });
            });
        }

        function setupAddPanel() {
            // Ohne Backend (GitHub Pages) gibt es nichts zu speichern.
            const hasBackend = dataSource === '/api/trees';
            addPanel.hidden = !hasBackend;
            addHint.hidden = hasBackend;
            if (hasBackend) fillCategories();
        }

        addToggle.addEventListener('click', () => {
            addForm.hidden = !addForm.hidden;
            addStatus.textContent = '';
        });

        document.getElementById('add-cancel').addEventListener('click', () => {
            addForm.reset();
            addForm.hidden = true;
            uploadedCover = '';
            addStatus.textContent = '';
        });

        addCover.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            addStatus.textContent = 'Titelbild wird hochgeladen …';
            const body = new FormData();
            body.append('file', file);
            body.append('id', document.getElementById('add-title').value);

            try {
                const response = await fetch('/api/covers', { method: 'POST', body });
                const result = await response.json();

                if (!response.ok) {
                    uploadedCover = '';
                    addStatus.textContent = result.error || 'Titelbild konnte nicht hochgeladen werden.';
                    return;
                }

                uploadedCover = result.cover;
                addStatus.textContent = `Titelbild gespeichert: ${result.cover}`;
            } catch (error) {
                uploadedCover = '';
                addStatus.textContent = 'Server nicht erreichbar.';
            }
        });

        addForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                parent_id: addParent.value,
                title: document.getElementById('add-title').value,
                author: document.getElementById('add-author').value,
                desc: document.getElementById('add-desc').value,
                wiki: document.getElementById('add-wiki').value,
                recommended: document.getElementById('add-recommended').checked
            };
            if (uploadedCover) payload.cover = uploadedCover;

            addStatus.textContent = 'Wird gespeichert …';

            try {
                const response = await fetch('/api/works', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (!response.ok) {
                    addStatus.textContent = result.error || 'Speichern fehlgeschlagen.';
                    return;
                }

                const parentId = result.parentId;
                addForm.reset();
                uploadedCover = '';
                addStatus.textContent = `Gespeichert: ${result.node.title}`;
                trees = await loadTrees();
                fillCategories();
                navigateTo(parentId);
            } catch (error) {
                addStatus.textContent = 'Server nicht erreichbar.';
            }
        });

        backBtn.addEventListener('click', goBack);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') goBack();
        });

        treeButtons.forEach(btn => {
            btn.addEventListener('click', () => switchTree(btn.dataset.tree));
        });

        start();
    </script>
</body>
</html>
