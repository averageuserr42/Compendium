    <style>
        :root {
            --bg: #0A0A0A;
            --card-bg: #121712;
            --green: #33FF66;
            --green-dim: #1F8F44;
            --text-white: #FFFFFF;
            --text-muted: #9FCDAF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text-white);
            font-family: ui-monospace, 'Courier New', monospace;
            min-height: 100vh;
            padding: 2.5rem 2rem;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 2.5rem auto;
            border-bottom: 1px solid var(--green-dim);
            padding-bottom: 1.5rem;
        }

        header h1 {
            color: var(--green);
            letter-spacing: 0.2em;
            margin: 0 0 0.5rem 0;
            font-size: 1.7rem;
        }

        header .subtitle {
            color: var(--text-muted);
            margin: 0 0 0.35rem 0;
            font-size: 0.95rem;
        }

        header .legend {
            color: var(--green-dim);
            margin: 0;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
        }

        #app-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .tree-switcher {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .tree-btn {
            background: transparent;
            border: 1px solid var(--green-dim);
            color: var(--text-muted);
            padding: 0.55rem 1.1rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tree-btn.active,
        .tree-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: rgba(51, 255, 102, 0.06);
        }

        .nav-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.75rem;
            min-height: 2rem;
        }

        #back-btn {
            background: transparent;
            border: 1px solid var(--green-dim);
            color: var(--green);
            padding: 0.45rem 0.95rem;
            border-radius: 4px;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        #back-btn:hover {
            border-color: var(--green);
            background: rgba(51, 255, 102, 0.06);
        }

        #current-category {
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.1rem;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #262b26;
            border-left: 4px solid var(--green);
            border-radius: 4px 8px 8px 4px;
            padding: 1.5rem 1.5rem 1.5rem 1.25rem;
            cursor: pointer;
            transition: background-color 0.25s, box-shadow 0.25s, border-left-color 0.25s;
            animation: cardIn 0.35s ease-out backwards;
        }

        .card:hover {
            background-color: #161d16;
            box-shadow: 0 0 0 1px rgba(51, 255, 102, 0.08), 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .card h3 {
            color: var(--text-white);
            margin: 0 0 0.55rem 0;
            font-size: 1.25rem;
            line-height: 1.3;
        }

        .card .meta {
            display: inline-block;
            color: var(--green-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.75rem;
        }

        .card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.65;
        }

        .card.book {
            border-left-color: var(--green-dim);
            cursor: default;
        }

        .card.book:hover {
            border-left-color: var(--green);
        }

        .card.book h3 {
            font-style: italic;
            margin: 0 0 0.35rem 0;
            font-size: 1.25rem;
        }

        .card.book .author {
            color: var(--green);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 0.85rem;
            padding-bottom: 0.55rem;
            display: block;
            border-bottom: 1px solid rgba(159, 205, 175, 0.15);
        }

        .star {
            color: var(--green);
            font-size: 0.95em;
            margin-right: 0.25em;
            filter: drop-shadow(0 0 4px rgba(51, 255, 102, 0.4));
        }

        .cross-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 1rem;
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--green-dim);
            border-radius: 4px;
            color: var(--green);
            font-size: 0.85rem;
            cursor: pointer;
            background: rgba(51, 255, 102, 0.04);
            transition: border-color 0.2s, background-color 0.2s;
        }

        .cross-link:hover {
            border-color: var(--green);
            background: rgba(51, 255, 102, 0.1);
        }

        .cross-icon {
            font-weight: 700;
            font-size: 1em;
        }
    </style>
</head>

        let currentNode = trees[activeTreeKey];

        const grid = document.getElementById('content-grid');
        const backBtn = document.getElementById('back-btn');
        const categoryLabel = document.getElementById('current-category');
        const treeButtons = document.querySelectorAll('.tree-btn');

        function countWorks(node) {
            if (!node.children) return 0;
            return node.children.reduce((sum, child) => sum + (child.isBook ? 1 : countWorks(child)), 0);
        }

        function findPath(node, targetId, path = []) {
            const currentPath = [...path, node];
            if (node.id === targetId) return currentPath;
            if (!node.children) return null;
            for (const child of node.children) {
                const result = findPath(child, targetId, currentPath);
                if (result) return result;
            }
            return null;
        }

        function navigateTo(targetId) {
            for (const key of Object.keys(trees)) {
                const path = findPath(trees[key], targetId);
                if (!path) continue;

                const target = path[path.length - 1];
                activeTreeKey = key;

                if (target.isBook && path.length >= 2) {
                    historyStack = path.slice(0, -2);
                    currentNode = path[path.length - 2];
                } else {
                    historyStack = path.slice(0, -1);
                    currentNode = target;
                }

                updateSwitcher();
                renderNode(currentNode);
                return;
            }
        }

        function updateSwitcher() {
            treeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tree === activeTreeKey);
            });
        }

        function switchTree(key) {
            if (activeTreeKey === key) return;
            activeTreeKey = key;
            historyStack = [];
            currentNode = trees[key];
            updateSwitcher();
            renderNode(currentNode);
        }

        function updateBreadcrumb() {
            if (historyStack.length === 0) {
                categoryLabel.textContent = 'Wähle deinen Pfad';
                return;
            }
            const path = [...historyStack, currentNode].slice(1).map(n => n.title);
            categoryLabel.textContent = [treeLabels[activeTreeKey], ...path].join(' › ');
        }

        function goBack() {
            if (historyStack.length === 0) return;
            currentNode = historyStack.pop();
            renderNode(currentNode);
        }

        function renderNode(node) {
            grid.innerHTML = '';
            updateBreadcrumb();
            backBtn.style.display = historyStack.length > 0 ? 'block' : 'none';

            node.children.forEach((child, index) => {
                const card = document.createElement('div');
                card.className = 'card' + (child.isBook ? ' book' : '');
                card.style.animationDelay = `${index * 40}ms`;

                if (child.isBook) {
                    const star = child.recommended
                        ? '<span class="star" title="Persönlich gelesen und empfohlen">★</span> '
                        : '';
                    const crossLink = child.relatedId
                        ? `<div class="cross-link" data-target="${child.relatedId}"><span class="cross-icon">↔</span><span>${child.relatedTitle}</span></div>`
                        : '';

                    card.innerHTML = `
                        <h3>${star}${child.title}</h3>
                        <span class="author">Von ${child.author}</span>
                        <p>${child.desc}</p>
                        ${crossLink}
                    `;

                    const link = card.querySelector('.cross-link');
                    if (link) {
                        link.addEventListener('click', (e) => {
                            e.stopPropagation();
                            navigateTo(link.dataset.target);
                        });
                    }
                } else {
                    const count = countWorks(child);
                    const countLabel = count > 0
                        ? `<span class="meta">${count} ${count === 1 ? 'Werk' : 'Werke'}</span>`
                        : '';

                    card.innerHTML = `
                        <h3>${child.title}</h3>
                        ${countLabel}
                        <p>${child.desc}</p>
                    `;

                    card.addEventListener('click', () => {
                        historyStack.push(currentNode);
                        currentNode = child;
                        renderNode(currentNode);
                    });
                }

                grid.appendChild(card);
            });
        }

        backBtn.addEventListener('click', goBack);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') goBack();
        });

        treeButtons.forEach(btn => {
            btn.addEventListener('click', () => switchTree(btn.dataset.tree));
        });

        renderNode(currentNode);
    </script>
</body>
</html>
